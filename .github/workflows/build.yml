name: 云编译影视APP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 替换内置直播源接口
        run: |
          # 自行修改源码里的接口配置文件
          # 一般是 AppConfig.kt / Constants.kt / api.json
          sed -i 's|.*默认接口.*|const val API_URL = "http://home.jundie.top:81/top98.json"|g' app/src/main/java/**/AppConfig.kt || true
          sed -i 's|http.*\.json|http://home.jundie.top:81/top98.json|g' app/src/main/assets/api.json || true

       - name: 修复Theme.MyTv缺失
        run: |
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="Theme.MyTv" parent="Theme.MaterialComponents.DayNight.NoActionBar">
        <item name="colorPrimary">@color/purple_500</item>
        <item name="colorPrimaryVariant">@color/purple_700</item>
        <item name="colorOnPrimary">@color/white</item>
        <item name="colorSecondary">@color/teal_200</item>
        <item name="android:statusBarColor">?attr/colorPrimaryVariant</item>
    </style>
</resources>
EOF

      - name: 修复protobuf依赖缺失
        run: |
          sed -i '/dependencies {/a \
              implementation "com.google.protobuf:protobuf-java:3.25.3"\
              implementation "com.google.protobuf:protobuf-java-util:3.25.3"' app/build.gradle

      - name: 修复OkHttp/Retrofit依赖缺失
        run: |
          sed -i '/dependencies {/a \
              implementation "com.squareup.okhttp3:okhttp:4.12.0"\
              implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"\
              implementation "com.squareup.retrofit2:retrofit:2.9.0"\
              implementation "com.squareup.retrofit2:converter-gson:2.9.0"' app/build.gradle
       
      - name: 授予权限
        run: chmod +x gradlew

      - name: 编译Debug包
        run: ./gradlew assembleDebug

      - name: 上传编译好的APK
        uses: actions/upload-artifact@v4
        with:
          name: 影视APP_编译成品
          path: app/build/outputs/apk/debug/*.apk
